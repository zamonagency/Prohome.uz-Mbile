name: prohome_b2c
description: ProHome B2C — ko'chmas mulk, ustalar va ish e'lonlari mobil ilovasi.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  smooth_page_indicator: ^1.2.0+3

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  timeago: ^3.7.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
